[package]
name = "jmbots-local"
version = "0.1.0"
edition = "2024"
# tauri 2.12 和 memorycli（tree-sitter 0.27）都要 1.90 以上；Windows 上用 cargo +1.99.1。
rust-version = "1.90"
description = "jmbots 的本地壳子：双击开窗口装载后端网页、托盘、命令行；memorycli 融合进来，HTTP 接口提供记忆搜索和 RAG"
publish = false
default-run = "jmbots"

[lib]
name = "jmbots_local"
path = "src/lib.rs"

[[bin]]
name = "jmbots"
path = "src/main.rs"

# 版本由 Cargo.lock 锁死（Cargo.lock 跟着进 git）。
[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
memorycli = { path = "../memorycli" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
# RAG：Tantivy（BM25 全文检索）+ jieba 中文分词，不用嵌入模型（用户 11-05 定）。
tantivy = "0.27.0"
tantivy-jieba = "0.21.0"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
tiny_http = "0.12.0"
ureq = { version = "3.5.1", features = ["json"] }

# 不用 Tauri 的命令行、直接 cargo build --release 时，要这个特性才用打包进程序的 ui/（不找开发服务器）。
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[profile.release]
lto = "thin"
strip = true
