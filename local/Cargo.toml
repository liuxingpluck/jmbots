[package]
name = "jmbots-local"
version = "0.1.2"
edition = "2024"
# tauri 2.12 要较新的 Rust；Windows 上用 cargo +1.99.1。（2026-11-14 memorycli 搬进记忆服务 memsvc/）
rust-version = "1.90"
description = "jmbots 的本地壳子（基地，只承载）：双击开窗口装载后端网页、托盘、命令行；守护后端和托管服务（记忆服务 jmbots-memory 等）、更新、重启"
publish = false
default-run = "jmbots"

[lib]
name = "jmbots_local"
path = "src/lib.rs"

[[bin]]
name = "jmbots"
path = "src/main.rs"

# 版本由 Cargo.lock 锁死（Cargo.lock 跟着进 git）。
[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
tiny_http = "0.12.0"
ureq = { version = "3.5.1", features = ["json"] }

# 不用 Tauri 的命令行、直接 cargo build --release 时，要这个特性才用打包进程序的 ui/（不找开发服务器）。
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }
winrt-notification = "0.5.1"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[profile.release]
lto = "thin"
strip = true
