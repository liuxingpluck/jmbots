#   - name: base-bridge            # 基地转发：/api/update、/api/autostart、/api/memory/*、/api/rag/*；读 engine.index_url
#   - name: notify                 # 待确认、长任务结束时请基地弹右下角通知；url 不写就用 engine.index_url + /notify
#   - name: update-watch           # 盯基地的新版本，登记待确认；用户同意了叫基地去换；读 engine.index_url
