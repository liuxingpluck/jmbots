# decision 插件读的顶层段（挂了 decision 才要写）：
# decision:
#   models:                              # 用户 11-14 定：只用 jev-1.14 一个（不写就是它；jev-router 地区不可用）
#     - { model: magpie/openrouter/typesafe/jev-1.14, type: classifier }   # 分类器，直接给概率
#     # 也能写对话模型字符串 "供应商名/模型 ID"，但不要再几个模型取平均
#   combine: average                     # 合分：average 平均、min 取最低、max 取最高
#   allow_at: 0.8                        # 合出来的分 ≥ 它算放行（approval 给 decision_pass，默认也是 0.8，不能更低）
#   deny_at: 0                           # 合出来的分 < 它算拒绝；0 就是从不拒
#   timeout_ms: 10000                    # 一个模型最多等多久

# 录屏点击讲解。先在 plugins 里显式挂载 screen，再打开 enabled 并配置可读图的模型。
screen:
  enabled: false
  fps: 2
  buffer_seconds: 3
  frame_max_width: 1280
  frame_max_height: 720
  ring_max_bytes: 67108864
  crop_width: 480
  crop_height: 320
  jpeg_quality: 75
  image_max_bytes: 262144
  max_frame_age_ms: 1000
  click_debounce_ms: 250
  model: magpie/xiaomi/mimo-v2.6-flash
  # 备用模型 magpie/codex/gpt-6-luna 需要把下面的 thinking 改成 low。
  thinking: 'off'
  model_timeout_ms: 8000
  max_output_tokens: 160
  speak: false
  overlay_seconds: 6
  pause_on_lock: true
  pause_on_fullscreen: true
  blacklist:
    # 已有默认黑名单，按需追加进程 basename 或窗口标题片段。
    processes: []
    title_contains: []
    password_controls: true

# 网页听写。需要启用插件及转写后端；fake 只供模拟验证，不识别真实语音。
voice:
  enabled: false
  bot: ''
  ws_path: /api/voice/ws
  sample_rate: 16000
  asr:
    provider: sherpa  # sherpa / bailian（实时）/ xiaomi（整句）
    # fallback: xiaomi    # 可选，主备分别选本地与云端。云端取 providers 同名配置
    # bailian_model: fun-asr-realtime
    # xiaomi_model: mimo-v2.5-asr
  tts:
    provider: xiaomi   # xiaomi / local（MeloTTS）
    # fallback: local    # xiaomi 默认退 local。local 可显式退 xiaomi，none 关闭回退
    voice: mimo_default
  turn:
    silence_ms: 1200
    max_utterance_ms: 60000
    merge_window_ms: 30000
    pause_ms: 300
    max_per_minute: 30
    detector:          # false 时只用 ASR 原有静音端点
      local_model: 'builtin:zh-tail-v1'
      # cloud_model: 供应商名/小模型ID
      prefer: local
      timeout_ms: 400
  judge:
    min_chars: 6
    step_chars: 12
    step_ms: 1000
    allow_at: 0.8
    deny_at: 0.3
    timeout_ms: 12000
    max_per_minute: 30
    # models:          # 可选语音任务理解模型。未配则继续使用 decision/judge
    #   local_model: 本地供应商名/模型ID
    #   cloud_model: 云端供应商名/模型ID
    #   prefer: local
    #   timeout_ms: 2500
