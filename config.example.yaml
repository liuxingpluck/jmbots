# jmbots 主配置模板（docs/10 3.4）。实际配置是运行时目录（默认程序旁边的 jmbotsData\）里的 config.yaml（密钥直接写在里面，不进 git）。
# 运行时目录里没有 config.yaml 时，程序第一次启动会自己写一份最简的；想要完整的就复制本文件过去再填。

# 模型供应商：地址和密钥写在一起，想接几家接几家，名字自己起（模型 ID 写成“供应商名/模型 ID”）。
# 启动时向 base_url 的 /models 拉模型清单；一家连不上不挡别家，也不挡服务起来，每分钟再试。
providers:
  my_provider:                        # 供应商名，自己起；下面用到的模型 ID 都以它开头
    base_url: https://api.example.com/v1
    api_key: ''                       # 本地不要密钥的服务可以不写
    # api: openai-completions         # 协议：openai-completions（默认）、openai-responses、anthropic-messages
    # list_models: true               # 启动时向 <base_url>/models 拉清单（默认）；没有清单接口就写 false，只用下面手写的
    # compat:                         # 发请求时的兼容设置，原样交给 Pi（OpenAICompletionsCompat）
    #   supportsDeveloperRole: false
    #   supportsStore: false
    #   maxTokensField: max_tokens
    # model_compat:                   # 个别模型再加的兼容设置，如 DeepSeek 思考模式下调工具，要把上一步的思考原样带回去
    #   some-model: { requiresReasoningContentOnAssistantMessages: true }
    # models:                         # 手写的优先。清单只给 ID 时，没写的用保守值（上下文 128000、最大输出 8192、看不了图）
    #   some-model: { context_window: 128000, max_output_tokens: 8192, vision: true, thinking: [off, high], price: { input: 0.27, output: 1.1 } }
  # deepseek:                         # 再接一家照样写
  #   base_url: https://api.deepseek.com/v1
  #   api_key: ''

# 程序默认的模型：新开会话和 exec 审核的小循环用它。写成“供应商/模型 ID”。
# 会话要换模型由用户在网页上换；分派不再挑模型。
default_model: my_provider/some-model

# 程序级的决策模型。thinking：off、minimal、low、medium、high、xhigh、max，模型不支持的档位自动换成最近的。
models:
  # decision: { model: 供应商名/决策模型 ID }                  # 决策模型：分派、压缩、exec 审核先问它（供应商要有决策模型）；可以不配

# 唯一启用名单：一项一条机器人循环；[] 表示不启用。历史 bots/ 文件夹不会自动启用。
# 名字可以是中文，就是运行时 bots/ 下的文件夹名；language 选提示词：zh / en。
# 不写 bots 时，用运行时 bots/ 下已有的文件夹；都没有就起一个原始机器人“助手”。
bots:
  - name: 助手
    language: zh

engine:
  poll_ms: 300           # 机器人循环多久看一次新消息
  max_rounds: 300        # 一次运行最多多少步（调多少次模型）
  compress_at: 200000    # 上下文到多少 token 就考虑压缩（模型上限不到 250K 时用上限的 80%）
  exec_pass: 0.2         # exec 审核：决策模型给的“安全”概率不低于它就直接执行
  # vision_model: 供应商名/模型 ID            # 看不了图的模型读到图片时，先交给它转成文字；不写就不转
  # index_url: http://127.0.0.1:30090           # 基地的接口（记忆搜索、RAG）；不写就只搜自己的记忆、公共记忆和技能
  # memory_libs: memory,aiskills                # memory 工具还用 RAG 搜基地里的哪些库，逗号连着写；每半小时让基地增量更新这些库的索引；不写就不搜
  # wrapup_model: 供应商名/模型 ID            # 限时到点时写收尾总结的模型（不带工具、最低思考档）；不写用会话自己的模型
  # limit_default_minutes: 20          # 限时（docs/界面/03 第 2.1 节）：不选的时候最长做多少分钟（用户 11-06：最长 20 分钟）
  # limit_remind_before_minutes: 10    # 不选的时候，到点前多少分钟开始介入、报时（第 10 分钟）；选了 15、20 的提前 5 分钟
  # limit_extend_minutes: 5            # 到点判断快做完了，一次延长几分钟
  # limit_extend_times: 2              # 最多延长几次
  # limit_judge_model: 供应商名/决策模型 ID   # 到点判断用的决策模型；不写用 models.decision
  # limit_review_model: 供应商名/模型 ID      # 延了两次还没做完时的审核模型：看有没有离谱、要不要转新会话；不写用会话自己的模型，思考最强档
  # image_model: 供应商名/生图模型 ID          # 生图模型（image_generate 工具用）；不写就没有生图
  # fallback_chain: [供应商名/模型 ID, 供应商名/模型 ID]   # 模型被限流时依次换着试（模型库用）
  # fallback_max_tries: 5
  # retry_delays_ms: [2000, 5000]
  # rate_limit_cooldown_minutes: 5   # 模型被限流时先冷却、不再找它：报错里写了几点恢复就到那时，没写就冷却这么多分钟

# 并发配额：同一时间最多几个调用，超了排队（不报错）。
concurrency:
  default: 3     # 每个模型默认最多几个
  models: {}     # 单独设的模型，如 'my_provider/some-model': 6
  providers: {}  # 供应商合计上限（它所有模型加起来），如 my_provider: 10；不写不限

# 网页搜索（web_search 工具）：按顺序试，前一个出错或搜不到就用下一个。不写这一节就不能搜网页（机器人搜的时候会说去设置的“搜索”里加）。
#   magpie     Magpie 网关的搜索接口（POST <base_url>/alpha/search）：provider 写用 providers 里哪一家的地址和密钥（也可以直接写 url、api_key），
#              model 写网关里用哪个模型的身份搜（网关里的模型 ID，不带供应商名）
#   zhipu_mcp  智谱 MCP 搜索（GLM Coding 套餐），api_key 填智谱的密钥；url 不写用 https://open.bigmodel.cn/api/mcp/web_search_prime/mcp
# search:
#   - { kind: magpie, provider: my_provider, model: 网关里的模型 ID }
#   - { kind: zhipu_mcp, api_key: '' }

# 工具放哪（相对运行时目录，也可以写绝对路径）：一个工具一个文件夹，exec 把它们的 bin/（或文件夹本身）放到 PATH 最前面。
# paths:
#   runtimes: runtimes   # Python、Node、Bun、uv 这些语言运行环境
#   program: program     # ffmpeg 这类开源程序；清单在 program/工具清单.md

# HTTP 服务：一律监听 0.0.0.0（换版本时的试运行也一样）。
# 本机（127.0.0.1、::1）来的请求不查令牌；别的机器来的 /api/*、/files/* 要带 server.token。
# server.token 是给别的机器访问用的固定令牌，写死在这里，不要每次生成新的；可以是空（＝没有主令牌，别的机器要用 /api/tokens 建的令牌）；网页和 /test 页面本身不用令牌。
# 0.4 的 http: 段优先：有 http 用 http，没有才用 server；0.6 不改写 config.yaml。
server:
  host: 0.0.0.0
  port: 30086
  token: ''

# 本地壳子（local/ 编出来的 jmbots.exe：窗口、托盘、命令行；记忆搜索和 RAG 接口，取代独立的 memorycli 服务）。不写全用默认值。
# local:
#   port: 30090        # 壳子的 HTTP 接口，一律监听 0.0.0.0；engine.index_url 指到这里
#   server: ''         # 窗口打开哪个后端的网页；不写就是本机的 server.port
#   libs: data/index/libs   # 记忆库目录，相对运行时目录；下面每个子目录一个 index.db，子目录名是库名
#   rag: data/index/rag     # RAG 索引目录，相对运行时目录

# 聊天渠道。飞书写成列表：几个飞书应用就写几项，每项对应一个机器人；回复从收到消息的那个应用发回去。
channels:
  feishu:
    - app_id: ''
      app_secret: ''
      bot: 助手
    # - app_id: ''           # 第二个飞书应用，对应另一个机器人
    #   app_secret: ''
    #   bot: 小助手

# 事件（docs/11）：会话循环在断点上报事件，只是记录，不挡流程；/api/events 能查。
# events:
#   keep_days: 30                 # 事件留多少天
#   max_depth: 5                  # 事件链最多几层
#   gate_timeout_ms: 10000        # 拦处理器最多等多久，超时按放行
#   watch_think_slow_seconds: 120 # 一步想多久算太慢
#   watch_think_max_steps: 40     # 一次运行走多少步算太多
#   watch_tool_fail_run: 3        # 同一个工具连着错几次要记
#   watch_rag_slow_ms: 3000       # 一次搜索多久算太慢
#   watch_rag_repeat: 3           # 同一句搜几次算反复

