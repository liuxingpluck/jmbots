# decision 插件读的顶层段（挂了 decision 才要写）：
# decision:
#   models:                              # 用户 11-14 定：只用 jev-1.14 一个（不写就是它；jev-router 地区不可用）
#     - { model: magpie/openrouter/typesafe/jev-1.14, type: classifier }   # 分类器，直接给概率
#     # 也能写对话模型字符串 "供应商名/模型 ID"，但不要再几个模型取平均
#   combine: average                     # 合分：average 平均、min 取最低、max 取最高
#   allow_at: 0.8                        # 合出来的分 ≥ 它算放行（approval 给 decision_pass，默认也是 0.8，不能更低）
#   deny_at: 0                           # 合出来的分 < 它算拒绝；0 就是从不拒
#   timeout_ms: 10000                    # 一个模型最多等多久
